name: Republish npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate and publish (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate tag input
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # npm provenance uses the workflow event's ref/SHA, not checkout.ref.
          # Run this workflow on the release tag to attest the actual source.
          if [ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "::error::Dispatch this workflow on the release tag (gh workflow run republish-npm.yml --ref $RELEASE_TAG -f tag=$RELEASE_TAG)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify tag version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: test "$(node -p "require('./package.json').version")" = "${RELEASE_TAG#v}"
  verify:
    needs: check-tag
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}
  publish:
    name: Publish validated package to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: validated-package
          path: release-package
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - name: Verify validated package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          tar -xOf release-package/*.tgz package/package.json > "$RUNNER_TEMP/package.json"
          test "$(node -p "require(process.env.RUNNER_TEMP + '/package.json').version")" = "${RELEASE_TAG#v}"
      - name: Publish with provenance
        run: npm publish release-package/*.tgz --ignore-scripts --provenance --access public
      - name: Verify npm publication
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: npm view "@michalfidor/playswag@${RELEASE_TAG#v}" version
