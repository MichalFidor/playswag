# Re-run npm publish for a tag (e.g. after a failed release job).
# Uses npm trusted publishing (OIDC) — configure on npmjs.com → Package → Trusted Publisher.
name: Republish npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v1.10.3)'
        required: true
        default: v1.10.3

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish ${{ inputs.tag }} to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify package.json matches tag
        run: |
          TAG_VERSION="${{ inputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json ($PKG_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Publish to npm (trusted publishing)
        id: npm_oidc
        continue-on-error: true
        run: npm publish --provenance --access public

      - name: Publish to npm (token fallback)
        if: steps.npm_oidc.outcome == 'failure'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::npm OIDC publish failed and NPMJS_TOKEN is not set."
            exit 1
          fi
          npm publish --access public

      - name: Verify npm publish succeeded
        run: |
          TAG_VERSION="${{ inputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          npm view "@michalfidor/playswag@${TAG_VERSION}" version
