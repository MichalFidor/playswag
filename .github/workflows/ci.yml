name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('["20.x"]') || fromJSON('["20.x", "22.x"]') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Smoke test published CLI
        run: node dist/esm/cli.js --help

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Integration tests
        run: npm run test:integration

      - name: E2E example tests
        run: npm run test:examples

  smoke-examples:
    name: Smoke — playswag-examples repo
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout playswag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: playswag

      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: playswag/package-lock.json

      - name: Install + build playswag
        working-directory: playswag
        run: npm ci && npm run build

      - name: Pack playswag
        id: pack
        working-directory: playswag
        run: |
          TARBALL=$(npm pack --json | jq -r '.[0].filename')
          echo "tarball=$(pwd)/${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Checkout playswag-examples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MichalFidor/playswag-examples
          path: examples

      - name: Install examples dependencies
        working-directory: examples
        run: npm ci

      - name: Swap to local playswag build
        working-directory: examples
        run: npm install "${{ steps.pack.outputs.tarball }}"

      - name: Install Playwright browsers
        working-directory: examples
        run: npx playwright install --with-deps chromium

      - name: Run examples
        working-directory: examples
        run: npm run test:ci

      - name: Upload examples coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smoke-examples-report
          path: examples/playswag-report/
          retention-days: 7
