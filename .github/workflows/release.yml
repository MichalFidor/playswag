name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish validated package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require release commit to be merged into main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-package
          path: release-package
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - name: Verify version and prepare release notes
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          tar -xOf release-package/*.tgz package/package.json > "$RUNNER_TEMP/package.json"
          test "$(node -p "require(process.env.RUNNER_TEMP + '/package.json').version")" = "$VERSION"
          node scripts/extract-release-notes.mjs "$VERSION" "$RUNNER_TEMP/changelog.md"
      - name: Publish to npm with provenance (OIDC)
        id: npm_oidc
        continue-on-error: true
        run: npm publish ./release-package/*.tgz --ignore-scripts --provenance --access public
      - name: Publish to npm (token fallback)
        if: steps.npm_oidc.outcome != 'success'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@michalfidor/playswag@${VERSION}" version >/dev/null 2>&1; then
            echo "Already published ${VERSION} (OIDC succeeded)."
            exit 0
          fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::npm OIDC publish failed and NPMJS_TOKEN is not set. Configure Trusted Publisher or add NPMJS_TOKEN."
            exit 1
          fi
          npm publish ./release-package/*.tgz --ignore-scripts --access public
      - name: Verify npm publication
        run: ./scripts/wait-npm-version.sh "@michalfidor/playswag" "${GITHUB_REF_NAME#v}"
      - name: Create GitHub Release after npm publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/changelog.md"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/changelog.md"
          fi
      - name: Set up GitHub Packages registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://npm.pkg.github.com
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish ./release-package/*.tgz --ignore-scripts --access public
