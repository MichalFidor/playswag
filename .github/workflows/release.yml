name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish validated package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require release commit to be merged into main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: validated-package
          path: release-package
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - name: Verify version and prepare release notes
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          tar -xOf release-package/*.tgz package/package.json > "$RUNNER_TEMP/package.json"
          test "$(node -p "require(process.env.RUNNER_TEMP + '/package.json').version")" = "$VERSION"
          awk -v version="$VERSION" 'index($0, "## [" version "]") == 1 { found=1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > "$RUNNER_TEMP/changelog.md"
          if [ ! -s "$RUNNER_TEMP/changelog.md" ]; then
            echo "::error::Add a changelog entry for $VERSION before releasing."
            exit 1
          fi
      - name: Publish to npm with provenance
        run: npm publish ./release-package/*.tgz --ignore-scripts --provenance --access public
      - name: Verify npm publication
        run: npm view "@michalfidor/playswag@${GITHUB_REF_NAME#v}" version
      - name: Create GitHub Release after npm publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/changelog.md"
      - name: Set up GitHub Packages registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://npm.pkg.github.com
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish ./release-package/*.tgz --ignore-scripts --access public
